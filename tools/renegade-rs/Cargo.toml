[package]
name = "renegade"
version = "0.1.0"
edition = "2024"
description = "Renegade in Rust: turns an Apple IPSW into a PAC-stripped HFS+ root image for the Poco F1 (Bergamota)"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "renegade-rs"
path = "src/bin/renegade-rs.rs"

[dependencies]
unicode-normalization = "0.1.24"
sha2 = "0.10.9"
sha1 = "0.10.6"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
lto = "thin"
codegen-units = 4
